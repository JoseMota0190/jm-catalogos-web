<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2BB5A0">
  <meta name="description" id="meta-description" content="">
  <title id="page-title">Catálogo Web</title>
  <link rel="icon" id="favicon" href="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── NAVBAR ───────────────────────────── -->

            <defs>
              <radialGradient id="ig" cx="30%" cy="107%" r="130%">
                <stop offset="0%"  stop-color="#fdf497"/>

            <circle cx="17.3" cy="6.7" r="1.1" fill="white"/>
          </svg>

        <a href="#"
           id="tt-link" class="navbar__social"

          </svg>
        </a>
        <a href="cart.html" class="navbar__cart" aria-label="Ver carrito">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"

          <span class="navbar__cart-badge" id="cart-badge">0</span>
        </a>
      </div>

    </div>
  </header>

  <!-- ── HERO ──────────────────────────────── -->
  <section class="hero">
    <div class="hero__logo" id="hero-logo-wrap" style="display:none">
      <img id="store-logo" src="" alt="Logo">
    </div>
    <p class="hero__eyebrow" id="hero-eyebrow"></p>
    <h1 class="hero__title" id="hero-title"></h1>
    <div class="hero__info">
      <span class="hero__info-item" id="hero-location-wrap" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span id="hero-location"></span>
      </span>
      <span class="hero__info-sep" id="hero-info-sep" style="display:none"></span>
      <a href="#" id="hero-phone-link"
         class="hero__info-item hero__info-wa" style="display:none"

        </svg>
        <span id="hero-phone"></span>
      </a>
    </div>
  </section>

  <!-- ── CATÁLOGO ────────────────────────── -->
  <main class="catalog-main">

    <div class="catalog-heading">
      <h2 class="catalog-heading__title">Explora nuestro catálogo</h2>
    </div>

    <div class="cat-cards" id="cat-cards"></div>

    <div class="catalog-grid-wrap" id="catalog-grid-wrap" style="display:none">
      <div class="catalog-active-header">
        <button class="catalog-back-btn" id="catalog-back">← Volver</button>
        <h3 class="catalog-active-title" id="catalog-active-title"></h3>
      </div>
      <div class="products-grid" id="products-grid" role="list" aria-label="Productos"></div>
    </div>

  </main>

  <!-- ── SOBRE NOSOTROS ────────────────────── -->
  <section class="about-section" id="about-section" style="display:none">
    <div class="about-section__inner">

      <div class="about-section__image" id="about-image-wrap" style="display:none">
        <img id="about-image" src="" alt="">
      </div>

      <div class="about-section__text">
        <p class="about-section__eyebrow" id="about-eyebrow"></p>
        <h2 class="about-section__title" id="about-title"></h2>
        <p class="about-section__body" id="about-body"></p>

        <div class="about-badges" id="about-badges"></div>
      </div>

    </div>
  </section>

  <!-- ── EBOOK ──────────────────────────────── -->
  <section class="ebook-section" id="ebook-section" style="display:none">
    <div class="ebook-section__inner">

      <div class="ebook-section__img-wrap">
        <img id="ebook-image" src="" alt="" class="ebook-section__img">
      </div>

      <div class="ebook-section__text">
        <p class="ebook-section__eyebrow" id="ebook-eyebrow"></p>
        <h2 class="ebook-section__title" id="ebook-title"></h2>
        <p class="ebook-section__body" id="ebook-body"></p>
        <a href="#" id="ebook-btn"
           class="ebook-section__btn"
           target="_blank" rel="noopener noreferrer">
        </a>
      </div>

    </div>
  </section>

  <!-- ── FOOTER ────────────────────────────── -->

    <div class="site-footer__logo">
      <div>
        <div class="site-footer__name" id="footer-name"></div>
        <div class="site-footer__tagline" id="footer-tagline"></div>
      </div>
    </div>
    <div class="site-footer__info">
      <div class="site-footer__row" id="footer-location-wrap" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
        </svg>
        <span id="footer-location"></span>
      </div>

  <div class="bottom-cart-bar" id="bottom-cart-bar">
    <div class="bottom-cart-bar__text">
      <div class="bcb-count" id="bcb-count">0 productos</div>
      <div class="bcb-total" id="bcb-total">$0</div>
    </div>
    <button class="bcb-btn" onclick="window.location.href='cart.html'">Ver carrito →</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span>✓</span>
    <span id="toast-msg"></span>
  </div>

  <script src="app.js"></script>
  <script>
    initCatalog();
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('navbar--scrolled', window.scrollY > 50);
    }, { passive: true });
  </script>
</body>
</html>
