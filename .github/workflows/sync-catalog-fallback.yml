name: Actualizar respaldo del catálogo

# Mantiene frontend-template/productos.json al día con la base real.
# Ese archivo es sólo el respaldo de emergencia que se muestra (con aviso)
# cuando Render no responde. Si la API falla, el workflow no modifica nada.
#
# Horario: una vez al día, 12:00 UTC (09:00 en Venezuela).

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerar productos.json desde la API
        run: node scripts/sync-fallback.js

      - name: Commitear sólo si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend-template/productos.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el respaldo."
          else
            git commit -m "chore: actualizar respaldo del catálogo"
            git push
          fi
